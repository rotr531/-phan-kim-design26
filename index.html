<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Phan Kim Design — Architecture &amp; Interior</title>
    <meta name="description" content="Phan Kim Design — studio thiết kế kiến trúc và nội thất. Every space needs a direction. Thiết kế bắt đầu từ cách con người sống và cảm nhận không gian." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://phan-kim-design26.pages.dev/" />
    <meta property="og:title" content="Phan Kim Design — Architecture & Interior" />
    <meta property="og:description" content="Every space needs a direction. Thiết kế kiến trúc và nội thất, bắt đầu từ cách con người sống và cảm nhận không gian." />
    <meta property="og:image" content="https://phan-kim-design26.pages.dev/assets/asset-006.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phan Kim Design — Architecture & Interior" />
    <meta name="twitter:description" content="Every space needs a direction. Thiết kế kiến trúc và nội thất, bắt đầu từ cách con người sống và cảm nhận không gian." />
    <meta name="twitter:image" content="https://phan-kim-design26.pages.dev/assets/asset-006.jpg" />
    <link rel="icon" type="image/png" href="assets/asset-001.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      :root{
        --ink:#1c1a16;
        --ink-soft:#3a372f;
        --paper:#f4f1ea;
        --paper-2:#ece7db;
        --dark:#171512;
        --dark-2:#211e19;
        --line:rgba(28,26,22,.18);
        --line-light:rgba(244,241,234,.22);
        --muted:#6f6a5e;
        --muted-light:#a49c8d;
        --focus:#8a5a2b;
        --focus-dark:#dcb87f;
        --max:1480px;
        --pad:clamp(20px,4.5vw,64px);
        --dur:.7s;
        --ease:cubic-bezier(.22,.61,.21,1);
      }
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{
        margin:0;background:var(--paper);color:var(--ink);
        font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
        font-size:16.5px;line-height:1.65;font-weight:400;
        -webkit-font-smoothing:antialiased;
      }
      img{display:block;max-width:100%}
      a{color:inherit}
      button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
      :focus-visible{outline:2px solid var(--focus);outline-offset:3px}
      .mobile-menu :focus-visible,.lightbox :focus-visible,footer.site :focus-visible,.next-proj:focus-visible{outline-color:var(--focus-dark)}
      ::selection{background:var(--ink);color:var(--paper)}
      .wrap{max-width:var(--max);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
      .label{
        font-size:.72rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
        color:var(--muted);margin:0;
      }
      .label.on-dark{color:var(--muted-light)}
      .rule{border:0;border-top:1px solid var(--line);margin:0}
      /* Đoạn văn thân bài: pretty chống từ mồ côi ở cuối đoạn */
      .hero-intro,.studio-text p,.principle p,.page-head p,.detail-body .txt p,.foot-brand p,.contact-info p.lead{text-wrap:pretty}

      /* ---------- Header — overlay trong suốt kiểu Nordå ----------
         Hai bản logo (trắng / đen than) hoán đổi theo vùng nền bên dưới:
         vùng tối khai báo data-hdr="dark", JS bật .on-dark cho header. */
      .site-header{
        position:fixed;inset:0 0 auto 0;z-index:60;color:var(--ink);
        transition:color .35s ease;
      }
      .site-header .bar{
        max-width:var(--max);margin:0 auto;padding:0 var(--pad);
        height:88px;display:flex;align-items:center;justify-content:space-between;gap:24px;
      }
      .brand{display:flex;align-items:center;text-decoration:none;flex:none}
      .brand img{height:42px;width:auto}
      .brand .logo-w{display:none}
      .site-header.on-dark{color:#fff}
      .site-header.on-dark .logo-w{display:block}
      .site-header.on-dark .logo-c{display:none}
      .menu-btn{
        display:inline-flex;align-items:center;font-size:.95rem;font-weight:600;
        letter-spacing:.24em;text-transform:uppercase;padding:14px 0 14px 16px;color:inherit;min-height:48px;
      }
      .menu-btn:hover{text-decoration:underline;text-underline-offset:6px}

      /* ---------- Menu toàn màn hình ---------- */
      .mobile-menu{
        position:fixed;inset:0;z-index:70;background:var(--dark);color:var(--paper);
        display:none;flex-direction:column;padding:0 var(--pad) 40px;
      }
      .mobile-menu.open{display:flex}
      .mobile-menu .bar{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-light)}
      .mobile-menu .bar img{height:42px;width:auto}
      .mobile-menu nav{margin-top:7vh;display:flex;flex-direction:column;gap:6px}
      .mobile-menu nav a{
        color:var(--paper);text-decoration:none;font-size:clamp(2.5rem,8vw,4.4rem);
        font-weight:500;letter-spacing:-.02em;line-height:1.22;padding:14px 0;border-bottom:1px solid var(--line-light);
        display:flex;justify-content:space-between;align-items:baseline;
      }
      .mobile-menu nav a span{font-size:.8rem;letter-spacing:.22em;color:var(--muted-light);text-transform:uppercase}
      .mobile-menu nav a:hover,.mobile-menu nav a.active{text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:1px}
      .mobile-menu .foot{margin-top:auto;color:var(--muted-light);font-size:.95rem;line-height:1.9}
      .mobile-menu .foot a{color:var(--paper)}
      .close-btn{font-size:.9rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:14px 6px;color:var(--paper);min-height:48px}
      .close-btn:hover{text-decoration:underline;text-underline-offset:5px}

      /* ---------- Reveal ---------- */
      .js .rv{opacity:0;transform:translateY(22px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
      .js .rv.in{opacity:1;transform:none}

      /* ---------- Hero — ảnh full-bleed, cột chữ lệch dưới ảnh ---------- */
      .hero-full{height:96svh;min-height:520px;max-height:1040px}
      .hero-full img{width:100%;height:100%;object-fit:cover;object-position:center 28%}
      .hero-block{padding:clamp(64px,10vh,120px) 0}
      .hero-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0 clamp(16px,3vw,40px)}
      .hero-col{grid-column:4/13;max-width:64rem}
      .hero-col .label{margin-bottom:clamp(22px,3.5vh,36px)}
      h1.hero-title{
        font-size:clamp(2.6rem,7.6vw,7.15rem);line-height:1.07;font-weight:600;
        letter-spacing:-.02em;margin:0 0 30px;
      }
      /* Hai dòng cố định có chủ đích — không để "direction." rớt dòng một mình.
         Mỗi dòng nowrap; cỡ chữ mobile tính theo vw để dòng dài luôn vừa khung. */
      h1.hero-title .l{display:block;white-space:nowrap}
      .hero-intro{font-size:clamp(1.08rem,1.45vw,1.3rem);line-height:1.62;color:var(--ink-soft);max-width:35rem;margin:0 0 38px;font-weight:300}
      .hero-cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
      .btn{
        display:inline-flex;align-items:center;gap:12px;text-decoration:none;
        background:var(--ink);color:var(--paper);border:1px solid var(--ink);
        padding:15px 28px;font-size:.95rem;font-weight:500;letter-spacing:.02em;
        transition:background .25s ease,color .25s ease;
      }
      .btn:hover{background:transparent;color:var(--ink)}
      .btn .arr{font-size:1.05em;line-height:1}
      .btn.ghost{background:transparent;color:var(--ink)}
      .btn.ghost:hover{background:var(--ink);color:var(--paper)}
      .btn.light{background:var(--paper);color:var(--ink);border-color:var(--paper)}
      .btn.light:hover{background:transparent;color:var(--paper)}
      /* ---------- Khối số liệu khổ lớn ---------- */
      .stats{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,4vw,64px);margin-top:clamp(52px,9vh,92px)}
      .stat{border-top:1px solid var(--ink);padding-top:18px}
      .stat .num{display:block;font-size:clamp(4.4rem,8.6vw,8.4rem);line-height:.95;font-weight:500;letter-spacing:-.03em}
      .stat .cap{display:block;margin-top:16px;font-size:.78rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);line-height:1.6}

      /* ---------- Section heads ---------- */
      .sec{padding:clamp(64px,10vh,120px) 0}
      .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-top:1px solid var(--line);padding-top:26px;margin-bottom:clamp(36px,5vh,60px)}
      .sec-head h2{font-size:clamp(2.1rem,4vw,3.6rem);font-weight:600;letter-spacing:-.02em;line-height:1.18;margin:10px 0 0;text-wrap:balance}
      .sec-head .side{font-size:.85rem;color:var(--muted);text-align:right;flex:none}

      /* ---------- Works grid (home) ---------- */
      .works-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(28px,4vw,56px) clamp(16px,3vw,40px);align-items:end}
      .work-card{text-decoration:none;display:block;align-self:end}
      .work-card .ph{overflow:hidden;background:var(--paper-2)}
      .work-card img{width:100%;height:auto;transition:transform var(--dur) var(--ease)}
      .work-card:hover img,.work-card:focus-visible img{transform:scale(1.045)}
      .work-card .meta{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-top:16px}
      .work-card h3{font-size:clamp(1.25rem,1.9vw,1.6rem);font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.32}
      .work-card .sub{font-size:.88rem;color:var(--muted);margin-top:5px}
      .work-card .idx{font-size:.8rem;font-weight:600;letter-spacing:.14em;color:var(--muted)}
      .work-card .go{
        flex:none;width:40px;height:40px;border:1px solid var(--line);display:grid;place-items:center;
        font-size:1.05rem;opacity:0;transform:translate(-4px,4px);transition:.35s ease;margin-top:2px;
      }
      .work-card:hover .go,.work-card:focus-visible .go{opacity:1;transform:none;background:var(--ink);color:var(--paper);border-color:var(--ink)}
      .w-pos-1{grid-column:1/6}
      .w-pos-2{grid-column:7/13;margin-top:clamp(30px,6vw,90px)}
      .w-pos-3{grid-column:1/8}
      .w-pos-4{grid-column:8/13;margin-top:clamp(30px,6vw,96px)}
      .w-pos-5{grid-column:4/9}
      .all-link{display:flex;justify-content:center;margin-top:clamp(44px,6vh,72px)}

      /* ---------- Philosophy / Studio ---------- */
      .studio{background:var(--dark);color:var(--paper)}
      .studio .sec-head{border-top-color:var(--line-light)}
      .studio .sec-head .side{color:var(--muted-light)}
      .philosophy{
        font-size:clamp(1.7rem,3.3vw,2.9rem);line-height:1.4;font-weight:300;letter-spacing:-.01em;
        max-width:56rem;margin:0 0 clamp(40px,6vh,72px);text-wrap:balance;
      }
      .philosophy strong{font-weight:600}
      .studio-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(20px,3vw,40px);align-items:start}
      .studio-text{grid-column:1/6}
      .studio-text p{color:#d9d3c6;font-weight:300;margin:0 0 20px;max-width:32rem}
      .studio-text p:first-of-type{margin-top:22px}
      .studio-text .mark{width:64px;height:auto;margin-bottom:8px;opacity:.95}
      .studio-imgs{grid-column:6/13;display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(14px,2vw,24px)}
      .studio-imgs figure{margin:0}
      .studio-imgs figure:nth-child(2){margin-top:clamp(24px,4vw,56px)}
      .studio-imgs figcaption{font-size:.78rem;color:var(--muted-light);padding-top:9px}
      .studio-wide{grid-column:6/13;margin-top:clamp(20px,3vw,40px)}
      .studio-wide figure{margin:0}
      .studio-wide figcaption{font-size:.78rem;color:var(--muted-light);padding-top:9px}

      /* ---------- Principles strip ---------- */
      .principles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,3vw,48px)}
      .principle{border-top:1px solid var(--line);padding-top:20px}
      .principle .n{font-size:.8rem;font-weight:600;letter-spacing:.16em;color:var(--muted)}
      .principle h3{font-size:1.22rem;font-weight:600;margin:12px 0 8px;letter-spacing:-.01em}
      .principle p{margin:0;color:var(--ink-soft);font-weight:300;font-size:.98rem}

      /* ---------- Contact ---------- */
      .contact-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(28px,4vw,56px) clamp(16px,3vw,40px)}
      .contact-info{grid-column:1/6}
      .contact-info h2{font-size:clamp(2.2rem,4.4vw,3.8rem);font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:12px 0 22px;text-wrap:balance}
      .contact-info p.lead{font-weight:300;color:var(--ink-soft);max-width:26rem;margin:0 0 34px}
      .c-row{border-top:1px solid var(--line);padding:16px 0;display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:baseline}
      .c-row .k{font-size:.74rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
      .c-row .v{font-size:1.06rem;font-weight:500}
      .c-row a{text-decoration:none;border-bottom:1px solid transparent}
      .c-row a:hover{border-bottom-color:var(--ink)}
      .c-row .person{font-size:.9rem;color:var(--muted);font-weight:400}
      .contact-form{grid-column:7/13}
      .contact-form .f-note{font-size:.88rem;color:var(--muted);margin:0 0 22px;font-weight:300}
      .field{margin-bottom:20px}
      .field label{display:block;font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
      .field input,.field select,.field textarea{
        width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
        padding:10px 2px 12px;font:inherit;font-size:1rem;color:var(--ink);border-radius:0;
      }
      .field textarea{border:1px solid var(--line);padding:12px;min-height:120px;resize:vertical;background:#fff8}
      .field select{appearance:none;-webkit-appearance:none;background-image:url("assets/asset-002.svg");background-repeat:no-repeat;background-position:right 4px center}
      .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
      .form-status{margin-top:18px;font-size:.95rem;display:none}
      .form-status.show{display:block}
      .form-status.ok{color:#3d5a26}
      .form-status.err{color:#9c3226}

      /* ---------- Dải statement full-bleed (đầu mục Studio) ---------- */
      .statement{position:relative;margin:0;overflow:hidden;background:var(--dark)}
      .statement img{width:100%;height:min(92svh,920px);min-height:460px;object-fit:cover;object-position:center 82%}
      .statement figcaption{position:absolute;left:0;right:0;bottom:0;padding-bottom:clamp(30px,5vh,58px)}
      .statement figcaption span{
        display:block;color:#fff;font-size:clamp(2rem,5vw,4.5rem);font-weight:500;
        line-height:1.16;letter-spacing:-.02em;max-width:15em;text-wrap:balance;
      }

      /* ---------- Bảng mục lục dự án ----------
         Khối mục lục ngồi trên cùng trục lệch 1/4 với khối tiêu đề hero:
         nội dung bắt đầu từ cột 4 của lưới 12 cột. */
      .idx-offset{display:grid;grid-template-columns:repeat(12,1fr);gap:0 clamp(16px,3vw,40px)}
      .idx-offset>*{grid-column:4/13}
      .index-table{border-top:1px solid var(--line);margin-bottom:clamp(48px,7vh,76px)}
      .idx-row{
        display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr) auto;
        gap:8px clamp(16px,3vw,40px);align-items:baseline;
        padding:clamp(18px,2.6vh,26px) 0;border-bottom:1px solid var(--line);text-decoration:none;
      }
      .idx-name{font-size:clamp(1.1rem,2vw,1.55rem);font-weight:600;text-transform:uppercase;letter-spacing:.005em;line-height:1.32}
      .idx-meta{color:var(--muted);font-size:.97rem}
      .idx-year{font-weight:600;letter-spacing:.05em;white-space:nowrap}
      .idx-row:hover .idx-name,.idx-row:focus-visible .idx-name{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}

      /* ---------- Footer ---------- */
      footer.site{background:var(--dark);color:var(--paper);padding:clamp(52px,8vh,84px) 0 34px;position:relative;overflow:hidden}
      /* Watermark neo ở mép dưới, tràn khỏi khung nhìn — vùng liên kết phía
         trên hoàn toàn sạch, chữ chỉ hiện ở dải chân trang. */
      .foot-wm{
        position:absolute;bottom:-.24em;left:50%;transform:translateX(-50%);
        font-size:clamp(6rem,17.5vw,17rem);line-height:.82;font-weight:600;letter-spacing:-.02em;
        color:rgba(244,241,234,.05);white-space:nowrap;pointer-events:none;user-select:none;
      }
      .foot-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:28px clamp(16px,3vw,40px);align-items:start;position:relative;z-index:1}
      .foot-bottom{position:relative;z-index:1}
      .foot-brand{grid-column:4/8}
      .foot-brand img{height:52px;width:auto;margin-bottom:18px}
      .foot-brand p{color:var(--muted-light);font-weight:300;margin:0;max-width:22rem;font-size:.95rem}
      .foot-nav{grid-column:8/10;display:flex;flex-direction:column;gap:14px}
      .foot-nav .label{margin-bottom:6px}
      .foot-nav a{color:var(--paper);text-decoration:none;font-size:clamp(1.45rem,2.4vw,2.05rem);font-weight:500;line-height:1.3}
      .foot-nav a:hover{text-decoration:underline;text-underline-offset:4px}
      .foot-contact{grid-column:10/13;font-size:.98rem;line-height:2}
      .foot-contact a{color:var(--paper);text-decoration:none}
      .foot-contact a:hover{text-decoration:underline;text-underline-offset:4px}
      .foot-contact .k{color:var(--muted-light);font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;display:block;line-height:1.4;margin-top:10px}
      .foot-contact .k:first-child{margin-top:0}
      .foot-bottom{border-top:1px solid var(--line-light);margin-top:clamp(36px,5vh,56px);padding-top:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted-light)}

      /* ---------- Projects list ---------- */
      .page-head{padding:clamp(118px,15vh,164px) 0 clamp(30px,4vh,44px)}
      .page-head h1{font-size:clamp(2.9rem,6vw,5.2rem);font-weight:600;letter-spacing:-.02em;line-height:1.12;margin:12px 0 16px}
      .page-head p{font-weight:300;color:var(--ink-soft);max-width:38rem;margin:0}
      .filters{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:clamp(36px,5vh,56px)}
      .filters button{
        padding:12px 18px;font-size:.9rem;font-weight:500;border:1px solid transparent;letter-spacing:.02em;
      }
      .filters button:hover{border-color:var(--line)}
      .filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
      .filters .count{margin-left:auto;align-self:center;font-size:.85rem;color:var(--muted)}
      .list-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(36px,5vh,64px) clamp(16px,3vw,40px);padding-bottom:clamp(64px,9vh,110px);align-items:end}
      .empty-note{grid-column:1/-1;color:var(--muted);font-weight:300}

      /* ---------- Project detail ---------- */
      .detail-top{padding-top:clamp(104px,12vh,136px)}
      .back-link{display:inline-flex;gap:10px;align-items:center;text-decoration:none;font-size:.9rem;font-weight:500;padding:12px 0}
      .back-link:hover{text-decoration:underline;text-underline-offset:4px}
      .detail-head{padding:clamp(36px,6vh,64px) 0 clamp(28px,4vh,40px)}
      .detail-head .idx-line{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
      .detail-head h1{font-size:clamp(2.9rem,6.4vw,5.6rem);font-weight:600;letter-spacing:-.02em;line-height:1.12;margin:14px 0 0}
      .detail-head .headline{font-size:clamp(1.25rem,2.2vw,1.7rem);font-weight:300;color:var(--ink-soft);margin:16px 0 0;max-width:44rem;line-height:1.5;text-wrap:balance}
      .facts{display:grid;grid-template-columns:repeat(4,1fr);gap:22px clamp(16px,3vw,40px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin:clamp(30px,5vh,48px) 0}
      .facts .f .k{font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
      .facts .f .v{font-size:1rem;font-weight:500;line-height:1.45}

            '<p class="side">Triết lý thiết kế<br />của Phan Kim Design</p></div>' +
            '<p class="philosophy rv">Chúng tôi bắt đầu từ <strong>công năng</strong> nhưng không dừng ở công năng. Không chỉ là bố trí hay vật liệu — mà là <strong>cách con người cảm nhận và sống</strong> bên trong không gian đó.</p>' +
            '<div class="studio-grid">' +
              '<div class="studio-text rv">' +
                '<img class="mark" src="assets/asset-053.png" alt="" width="286" height="292" loading="lazy" />' +
                "<p>Mỗi công trình đều có một “kim chỉ nam” riêng — một ý tưởng trung tâm đủ rõ để mọi quyết định sau đó đều có lý do: vì sao cửa mở hướng này, vì sao chất liệu này ở đây, vì sao ánh sáng được giữ lại ở khoảng tường kia.</p>" +
                "<p>Khi kim chỉ nam đã rõ, chi tiết không còn là trang trí. Mỗi chi tiết tồn tại vì nó phục vụ cách con người sống trong không gian — và chính điều đó làm nên câu chuyện riêng của từng công trình, dù là một ngôi nhà, một cửa hàng hay một nơi lưu trú.</p>" +
                "<p>Phan Kim Design làm việc trên ba nhóm công trình: nhà ở, thương mại và lưu trú — từ căn hộ 58 m² đến khách sạn 23 phòng.</p>" +
              "</div>" +
              '<div class="studio-imgs">' +
                '<figure class="rv"><img src="assets/asset-054.jpg" width="451" height="599" alt="Đôi tay người thợ đang hoàn thiện bề mặt gỗ" /><figcaption>Hoàn thiện gỗ thủ công</figcaption></figure>' +
                '<figure class="rv"><img src="assets/asset-055.jpg" width="451" height="599" alt="Bảng phối vật liệu gỗ, đá và kim loại" /><figcaption>Phối vật liệu</figcaption></figure>' +
                '<figure class="rv"><img src="assets/asset-056.jpg" width="452" height="599" alt="Người thợ chế tác đá" /><figcaption>Chế tác đá</figcaption></figure>' +
              "</div>" +
              '<figure class="studio-wide rv"><img src="assets/asset-025.jpg" width="1600" height="1045" alt="Ánh nắng chiếu trên sàn terrazzo tại Bao Loc House" /><figcaption>Ánh sáng và vật liệu — sàn terrazzo tại Bao Loc House</figcaption></figure>' +
            "</div>" +
          "</div></section>" +

          /* PRINCIPLES */
          '<section class="sec" aria-labelledby="prinTitle"><div class="wrap">' +
            '<div class="sec-head rv"><div><p class="label">/ Cách chúng tôi làm việc</p><h2 id="prinTitle">Ba điểm tựa</h2></div></div>' +
            '<div class="principles">' +
              '<div class="principle rv"><span class="n">01</span><h3>Bắt đầu từ công năng</h3><p>Bố cục, luồng di chuyển và thói quen sinh hoạt được giải quyết trước — hình thức đi theo sau, không đi trước.</p></div>' +
              '<div class="principle rv"><span class="n">02</span><h3>Mỗi chi tiết có lý do</h3><p>Vật liệu, ánh sáng và chi tiết được chọn vì chúng phục vụ trải nghiệm sống, không phải để lấp đầy bản vẽ.</p></div>' +
              '<div class="principle rv"><span class="n">03</span><h3>Không gian kể câu chuyện</h3><p>Mỗi công trình giữ một cá tính riêng — của gia chủ, của thương hiệu, của vùng đất nơi nó đứng.</p></div>' +
            "</div>" +
          "</div></section>" +

          contactSection() +
          footerHTML()
        );
      }

      function listView() {
        var cards = PROJECTS.map(function (p) { return workCard(p, ""); }).join("");
        var rows = PROJECTS.map(function (p) {
          return (
            '<a class="idx-row" href="#/du-an/' + p.slug + '" data-cat="' + p.cat + '">' +
              '<span class="idx-name">' + esc(p.name) + "</span>" +
              '<span class="idx-meta">' + esc(p.type) + " · " + esc(p.location) + "</span>" +
              '<span class="idx-year">/ ' + p.year + "</span>" +
            "</a>"
          );
        }).join("");
        return (
          '<section class="wrap"><div class="page-head rv">' +
            '<p class="label">/ Dự án — Projects</p>' +
            "<h1>Tất cả dự án</h1>" +
            "<p>Năm công trình đã hoàn thiện trong giai đoạn 2023 — 2025: một khách sạn tại Lâm Đồng, một ngôi nhà tại Bảo Lộc, một cửa hàng tại TP.HCM, một căn hộ và một homestay tiền chế tại Đà Lạt.</p>" +
          "</div>" +
          '<div class="filters" role="group" aria-label="Lọc dự án theo loại hình">' +

            '<button type="button" data-filter="nha-o" aria-pressed="false">Nhà ở</button>' +
            '<button type="button" data-filter="thuong-mai" aria-pressed="false">Thương mại</button>' +
            '<button type="button" data-filter="luu-tru" aria-pressed="false">Lưu trú</button>' +
            '<span class="count" id="filterCount" aria-live="polite"></span>' +
          "</div>" +
          '<div class="idx-offset"><p class="label" style="margin-bottom:10px">/ Mục lục dự án</p>' +
          '<div class="index-table" id="indexTable">' + rows + "</div></div>" +
          '<div class="list-grid" id="listGrid">' + cards + "</div></section>" +
          footerHTML()
        );
      }

      function detailView(p) {
        var facts = p.facts.map(function (f) {
          return '<div class="f"><div class="k">' + esc(f[0]) + '</div><div class="v">' + esc(f[1]) + "</div></div>";
        }).join("");
        var intro = p.intro.map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("");
        var gallery = p.gallery.map(function (g, i) {
          return (
            '<figure class="gal rv ' + g.cls + '">' +
              '<button type="button" data-lb="' + i + '" aria-label="Phóng to ảnh: ' + esc(g.alt) + '">' +
              '<img src="' + g.src + '" width="' + g.w + '" height="' + g.h + '" alt="' + esc(g.alt) + '" loading="lazy" /></button>' +
              "<figcaption>" + (g.plan ? '<span class="plan-note">Mặt bằng</span><br />' : "") + esc(g.cap || "") + "</figcaption>" +
            "</figure>"
          );
        }).join("");
        var idx = PROJECTS.indexOf(p);
        var next = PROJECTS[(idx + 1) % PROJECTS.length];
        return (
          '<article class="wrap">' +
            '<div class="detail-top"><a class="back-link" href="#/du-an">← Tất cả dự án</a></div>' +
            '<header class="detail-head rv">' +
              '<div class="idx-line"><p class="label">/ Dự án ' + p.no + " / 05 · " + esc(CATS[p.cat]) + '</p><p class="label">/ ' + esc(p.location) + " · " + p.year + "</p></div>" +
              "<h1>" + esc(p.name) + "</h1>" +
              '<p class="headline">' + esc(p.headline) + "</p>" +
            "</header>" +
            '<div class="facts rv">' + facts + "</div>" +
            '<figure class="opening rv"><img src="' + p.opening.src + '" width="' + p.opening.w + '" height="' + p.opening.h + '" alt="' + esc(p.opening.alt) + '" fetchpriority="high" />' +
            "<figcaption>" + esc(p.opening.cap || "") + "</figcaption></figure>" +
            '<div class="detail-body"><div class="txt rv">' + intro + "</div></div>" +
            '<blockquote class="pull rv">“' + esc(p.quote) + "”</blockquote>" +
            '<div class="gallery" id="gallery">' + gallery + "</div>" +
          "</article>" +
          '<a class="next-proj" data-hdr="dark" href="#/du-an/' + next.slug + '" aria-label="Dự án tiếp theo: ' + esc(next.name) + '">' +
            '<span class="in"><span><span class="label">/ Dự án tiếp theo</span>' +
            "<h2>" + esc(next.name) + '</h2><span class="sub">' + esc(next.type) + " · " + esc(next.location) + " · " + next.year + "</span></span>" +
            '<span class="thumb"><img src="' + next.tile.src + '" width="' + next.tile.w + '" height="' + next.tile.h + '" alt="" loading="lazy" /></span></span>' +
          "</a>" +
          footerHTML()
        );
      }

      /* ---------- Reveal on scroll ---------- */
      var io = null;
      function initReveal() {
        var els = app.querySelectorAll(".rv");
        if (!("IntersectionObserver" in window)) {
          els.forEach(function (el) { el.classList.add("in"); });
          return;
        }
        if (io) io.disconnect();
        io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.08, rootMargin: "0px 0px -4% 0px" });
        els.forEach(function (el) { io.observe(el); });
        /* An toàn: nếu observer không kích hoạt (môi trường nhúng, chụp
           toàn trang…), vẫn hiện toàn bộ nội dung sau 1.4 giây. */
        setTimeout(function () {
          app.querySelectorAll(".rv:not(.in)").forEach(function (el) { el.classList.add("in"); });
        }, 1400);
      }

      /* ---------- Contact form ---------- */
      function initForm() {
        var form = document.getElementById("contactForm");
        if (!form) return;
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          var status = document.getElementById("formStatus");
          var name = document.getElementById("fName").value.trim();
          var contact = document.getElementById("fContact").value.trim();
          var type = document.getElementById("fType").value;
          var msg = document.getElementById("fMsg").value.trim();
          status.className = "form-status show err";
          if (!name || !contact || !msg) {
            status.textContent = "Vui lòng điền họ tên, email/số điện thoại và nội dung trao đổi.";
            return;
          }
          if (FORM_ENDPOINT) {
            status.className = "form-status show";
            status.textContent = "Đang gửi…";
            fetch(FORM_ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({ name: name, contact: contact, type: type, message: msg })
            }).then(function (r) {
              if (r.ok) {
                status.className = "form-status show ok";
                status.textContent = "Gửi thành công. Cảm ơn bạn — studio sẽ phản hồi trong thời gian sớm nhất.";
                form.reset();
              } else {
                status.className = "form-status show err";
                status.textContent = "Gửi chưa thành công. Vui lòng thử lại hoặc liên hệ trực tiếp qua điện thoại / email.";
              }
            }).catch(function () {
              status.className = "form-status show err";
              status.textContent = "Gửi chưa thành công. Vui lòng thử lại hoặc liên hệ trực tiếp qua điện thoại / email.";
            });
          } else {
            var subject = encodeURIComponent("Trao đổi dự án — " + name);
            var body = encodeURIComponent(
              "Họ tên: " + name + "\nEmail / SĐT: " + contact + "\nLoại hình công trình: " + (type || "—") + "\n\nNội dung trao đổi:\n" + msg
            );
            status.className = "form-status show ok";
            status.textContent = "Ứng dụng email của bạn đang mở với nội dung đã soạn sẵn — bấm Gửi trong email để hoàn tất. Nếu email không mở, hãy liên hệ trực tiếp: 08 966 599 47.";
            window.location.href = "mailto:" + CONTACT_EMAIL + "?subject=" + subject + "&body=" + body;
          }
        });
      }

      /* ---------- Filters ---------- */
      function initFilters() {
        var grid = document.getElementById("listGrid");
        if (!grid) return;
        var btns = document.querySelectorAll("[data-filter]");
        var count = document.getElementById("filterCount");
        function apply(cat) {
          var n = 0;
          grid.querySelectorAll(".work-card").forEach(function (card, i) {
            var show = cat === "all" || PROJECTS[i].cat === cat;
            card.style.display = show ? "" : "none";
            if (show) n++;
          });
          document.querySelectorAll("#indexTable .idx-row").forEach(function (row, i) {
            row.style.display = cat === "all" || PROJECTS[i].cat === cat ? "" : "none";
          });
          count.textContent = n + " / " + PROJECTS.length + " dự án";
          btns.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-filter") === cat ? "true" : "false"); });
        }
        btns.forEach(function (b) {
          b.addEventListener("click", function () { apply(b.getAttribute("data-filter")); });
        });
        apply("all");
      }

      /* ---------- Lightbox ---------- */
      var lb = document.getElementById("lightbox");
      var lbImg = document.getElementById("lbImg");
      var lbCap = document.getElementById("lbCap");
      var lbCount = document.getElementById("lbCount");
      var lbItems = [], lbIndex = 0;

      function lbShow(i) {
        lbIndex = (i + lbItems.length) % lbItems.length;
        var it = lbItems[lbIndex];
        lbImg.src = it.src;
        lbImg.alt = it.alt;
        lbCap.textContent = it.cap || it.alt;
        lbCount.textContent = (lbIndex + 1) + " / " + lbItems.length;
      }
      function lbOpen(items, i, trigger) {
        lbItems = items; lastFocus = trigger || document.activeElement;
        lb.classList.add("open");
        document.body.style.overflow = "hidden";
        lbShow(i);
        document.getElementById("lbClose").focus();
      }
      function lbCloseFn() {
        lb.classList.remove("open");
        document.body.style.overflow = "";
        lbImg.src = "assets/asset-005.gif";
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }
      document.getElementById("lbClose").addEventListener("click", lbCloseFn);
      document.getElementById("lbPrev").addEventListener("click", function () { lbShow(lbIndex - 1); });
      document.getElementById("lbNext").addEventListener("click", function () { lbShow(lbIndex + 1); });
      lb.addEventListener("click", function (e) { if (e.target === lb || e.target.id === "lbStage") lbCloseFn(); });
      document.addEventListener("keydown", function (e) {
        if (!lb.classList.contains("open")) return;
        if (e.key === "Escape") lbCloseFn();
        else if (e.key === "ArrowLeft") lbShow(lbIndex - 1);
        else if (e.key === "ArrowRight") lbShow(lbIndex + 1);
      });
      var touchX = null;
      lb.addEventListener("touchstart", function (e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
      lb.addEventListener("touchend", function (e) {
        if (touchX === null) return;
        var dx = e.changedTouches[0].clientX - touchX;
        if (Math.abs(dx) > 48) lbShow(lbIndex + (dx < 0 ? 1 : -1));
        touchX = null;
      }, { passive: true });

      function initGallery(p) {
        var gal = document.getElementById("gallery");
        if (!gal) return;
        var items = p.gallery.map(function (g) { return { src: g.src, alt: g.alt, cap: g.cap }; });
        gal.querySelectorAll("[data-lb]").forEach(function (btn) {
          btn.addEventListener("click", function () { lbOpen(items, parseInt(btn.getAttribute("data-lb"), 10), btn); });
        });
      }

      /* ---------- Mobile menu ---------- */
      var mobileMenu = document.getElementById("mobileMenu");
      var menuOpenBtn = document.getElementById("menuOpen");
      function openMenu() {
        lastFocus = document.activeElement;
        mobileMenu.classList.add("open");
        document.body.style.overflow = "hidden";
        document.getElementById("menuClose").focus();
      }
      function closeMenu() {
        mobileMenu.classList.remove("open");
        document.body.style.overflow = "";
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }
      menuOpenBtn.addEventListener("click", openMenu);
      document.getElementById("menuClose").addEventListener("click", closeMenu);
      mobileMenu.querySelectorAll("nav a").forEach(function (a) {
        a.addEventListener("click", function () {
          mobileMenu.classList.remove("open");
          document.body.style.overflow = "";
        });
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && mobileMenu.classList.contains("open")) closeMenu();
      });

      /* ---------- Header đổi tông theo vùng nền ----------
         Vùng nền tối (hero, dải statement + Studio, khối dự án tiếp theo,
         footer) khai báo data-hdr="dark". Khi đường giữa của header
         (y = 44px) nằm trên một vùng tối, header dùng logo trắng và
         chữ trắng; ngược lại dùng logo đen than và chữ mực. */
      var siteHeader = document.querySelector(".site-header");
      var hdrTicking = false;
      function updateHeaderTheme() {
        hdrTicking = false;
        var dark = false;
        document.querySelectorAll("[data-hdr='dark']").forEach(function (el) {
          var r = el.getBoundingClientRect();
          if (r.top <= 44 && r.bottom >= 44) dark = true;
        });
        siteHeader.classList.toggle("on-dark", dark);
      }
      function queueHeaderTheme() {
        if (!hdrTicking) { hdrTicking = true; requestAnimationFrame(updateHeaderTheme); }
      }
      window.addEventListener("scroll", queueHeaderTheme, { passive: true });
      window.addEventListener("resize", queueHeaderTheme);


      var motionObserver = null;
      var motionFrame = 0;
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var progress = document.createElement("div");
      progress.className = "scroll-progress"; progress.setAttribute("aria-hidden","true");
      document.body.appendChild(progress);
      var backTop = document.createElement("button");
      backTop.className="back-top"; backTop.type="button";
      backTop.setAttribute("aria-label","Về đầu trang"); backTop.textContent="↑";
      document.body.appendChild(backTop);
      backTop.addEventListener("click",function(){window.scrollTo({top:0,behavior:reduceMotion.matches?"instant":"smooth"});});
      function updatePortfolioScroll(){
        motionFrame=0;
        var y=window.scrollY, max=document.documentElement.scrollHeight-window.innerHeight;
        progress.style.transform="scaleX("+(max>0?Math.min(1,Math.max(0,y/max)):0)+")";
        document.querySelector(".site-header").classList.toggle("scrolled",y>90);
        backTop.classList.toggle("visible",y>700);
        var hero=document.querySelector(".hero-full>img");
        if(hero && !reduceMotion.matches && y<window.innerHeight*1.3)
          hero.style.transform="translate3d(0,"+Math.min(y*.15,140)+"px,0) scale(1.065)";
      }
      function queuePortfolioScroll(){if(!motionFrame)motionFrame=requestAnimationFrame(updatePortfolioScroll);}
      window.addEventListener("scroll",queuePortfolioScroll,{passive:true});
      window.addEventListener("resize",queuePortfolioScroll);
      function initPortfolioMotion(){
        var root=document.getElementById("app");
        if(root){root.classList.remove("route-enter");void root.offsetWidth;root.classList.add("route-enter");}
        document.querySelectorAll(".works-grid .rv,.principles .principle,.studio-imgs .rv").forEach(function(el,i){el.style.setProperty("--reveal-delay",(i%3)*90+"ms");});
        if(motionObserver)motionObserver.disconnect();
        if("IntersectionObserver" in window && !reduceMotion.matches){
          motionObserver=new IntersectionObserver(function(entries){
            entries.forEach(function(entry){
              if(!entry.isIntersecting)return;
              var el=entry.target,target=Number(el.dataset.countTarget),start=null;
              function tick(t){if(!el.isConnected)return;if(!start)start=t;var p=Math.min((t-start)/1100,1);el.textContent=String(Math.round(target*(1-Math.pow(1-p,3)))).padStart(2,"0");if(p<1)requestAnimationFrame(tick);}
              requestAnimationFrame(tick);motionObserver.unobserve(el);
            });
          },{threshold:.6});
          document.querySelectorAll(".stat .num").forEach(function(el){el.dataset.countTarget=el.textContent;motionObserver.observe(el);});
        }
        updatePortfolioScroll();
      }

      /* ---------- Router ---------- */
      function setNav(active) {
        document.querySelectorAll("[data-nav]").forEach(function (a) {
          a.classList.toggle("active", a.getAttribute("data-nav") === active);
        });
      }
      function render(html, nav) {
        app.innerHTML = html;
        setNav(nav);
        initReveal();
        initPortfolioMotion();
      }
      function route() {
        var hash = window.location.hash || "#/";
        window.scrollTo(0, 0);
        if (hash === "#/" || hash === "" || hash === "#") {
          document.title = "Phan Kim Design — Architecture & Interior";
          render(homeView(), "");
        } else if (hash === "#/studio") {
          document.title = "Studio — Phan Kim Design";
          render(homeView(), "studio");
          scrollToId("studio-sec");
        } else if (hash === "#/lien-he") {
          document.title = "Liên hệ — Phan Kim Design";
          render(homeView(), "lien-he");
          scrollToId("lien-he-sec");
        } else if (hash === "#/du-an") {
          document.title = "Dự án — Phan Kim Design";
          render(listView(), "du-an");
          initFilters();
        } else if (hash.indexOf("#/du-an/") === 0) {
          var p = bySlug(hash.slice("#/du-an/".length));
          if (p) {
            document.title = p.name + " — Phan Kim Design";
            render(detailView(p), "du-an");
            initGallery(p);
          } else {
            document.title = "Dự án — Phan Kim Design";
            render(listView(), "du-an");
            initFilters();
          }
        } else {
          document.title = "Phan Kim Design — Architecture & Interior";
          render(homeView(), "");
        }
        initForm();
        updateHeaderTheme();
      }
      function scrollToId(id) {
        requestAnimationFrame(function () {
          var el = document.getElementById(id);
          if (el) {
            var y = el.getBoundingClientRect().top + window.scrollY - 84;
            window.scrollTo(0, y);
          }
        });
      }
      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
